
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the Color</title>
    
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet">

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  rel="stylesheet">

    <link rel="stylesheet" href="../assets/full.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">
                <i class="bi bi-controller me-2"></i>Color Guessing Game
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navSticky" aria-controls="navSticky" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navSticky">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Concept</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="full.html">Full Game</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="page-content">
      <div class="game-card">
        <h1>Guess the Color!</h1>

        <div class="player-panel">
            <label for="playerName">Player Name</label>
            <input id="playerName" type="text" maxlength="20" placeholder="Enter your name" />
        </div>

        <div class="meta-row">
            <span id="dateTime">Date: --</span>
            <span id="highScore">High Score: 0</span>
        </div>

        <div class="controls">
            <button id="startBtn" type="button">Start</button>
            <button id="endBtn" type="button" class="end-btn">End</button>
        </div>

        <div class="hud">
            <span id="score">Score: 0</span>
            <span id="timer">Time: 10</span>
        </div>

        <div id="targetColor" class="color-block" aria-label="Target color"></div>

        <div id="status" class="status" aria-live="polite">
            Press Start to begin.
        </div>

        <div id="choices" class="choices" aria-label="Color choices"></div>

        <div id="resultBox" class="result-box hidden" aria-live="polite"></div>
      </div>
    </main>
    
<footer class="container-fluid bg-dark text-light py-3">
        <div class="container d-flex justify-content-between flex-wrap gap-2">
            <span>&copy; 2026 Color Guessing Game</span>
            <div>
                <a class="link-light me-3" href="https://github.com/jacobej15/color-guessing-game.git"
                    target="_blank">
                    <i class="bi bi-github me-1"></i>Repo
                </a>
                <a class="link-light" href="https://github.com/jacobej15" target="_blank">
                    <i class="bi bi-person-circle me-1"></i>Profile
                </a>
            </div>
        </div>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/full.js"></script>

</body>
</html>
