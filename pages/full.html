
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the Color</title>
    
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet">

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  rel="stylesheet">

    <link rel="stylesheet" href="../assets/full.css" />
</head>

<body>
    <div class="game-card">
        <h1>Guess the Color!</h1>

        <div class="player-panel">
            <label for="playerName">Player Name</label>
            <input id="playerName" type="text" maxlength="20" placeholder="Enter your name" />
        </div>

        <div class="meta-row">
            <span id="dateTime">Date: --</span>
            <span id="highScore">High Score: 0</span>
        </div>

        <div class="controls">
            <button id="startBtn" type="button">Start</button>
            <button id="endBtn" type="button" class="end-btn">End</button>
        </div>

        <div class="hud">
            <span id="score">Score: 0</span>
            <span id="timer">Time: 10</span>
        </div>

        <div id="targetColor" class="color-block" aria-label="Target color"></div>

        <div id="status" class="status" aria-live="polite">
            Press Start to begin.
        </div>

        <div id="choices" class="choices" aria-label="Color choices"></div>

        <div id="resultBox" class="result-box hidden" aria-live="polite"></div>
    </div>

    <script src="../assets/full.js"></script>
    
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
